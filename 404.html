<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Amine Nakrou</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/portfolio/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #f7f8f7; --ink: #141a1c; --ink-2: #4b585c; --ink-3: #6f7c80; --rule: #d9dfdc; --accent: #0d6b52; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0f1413; --ink: #e5ebe9; --ink-2: #a4b1ad; --ink-3: #7e8c88; --rule: #26302d; --accent: #49c497; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 'IBM Plex Sans', system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; width: 100%; }
    .code { font-family: 'IBM Plex Mono', monospace; font-size: .85rem; color: var(--ink-3); padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
    h1 { font-family: 'Schibsted Grotesk', Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; margin: 22px 0 14px; }
    p { color: var(--ink-2); margin: 0; }
    a { display: inline-block; margin-top: 26px; padding: 11px 18px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 3px; font-weight: 500; }
    @media (prefers-color-scheme: dark) { a { color: #062018; } }
  </style>
</head>
<body>
  <main>
    <p class="code">Erreur 404 · sinistre non déclaré</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être ancien ou mal recopié. Tout le portfolio tient désormais sur une seule page.</p>
    <a href="/portfolio/">Revenir au portfolio</a>
  </main>
</body>
</html>
